<svg xmlns="http://www.w3.org/2000/svg" name="Cover + Track" width="232" height="50" viewBox="0 0 232 50" fill="#FFF" font-size="14">
    <!-- <rect id="background" width="232" height="50" fill="#00f"/> -->
    <defs>
        <mask id="coverMask" maskUnits="userSpaceOnUse" x="0" y="0" width="38" height="38">
            <rect x="0" y="0" width="38" height="38" rx="4" ry="4" fill="#fff"/>
        </mask>
    </defs>

    <g id="cover" size="38" transform="translate(6 6)" mask="url(#coverMask)"></g>
    <text id="title" x="50" y="21" font-weight="590" clip-width="172"></text>
    <text id="artist" x="50" y="39" font-weight="590" fill="#B3B3B3">Artist</text>
</svg>
