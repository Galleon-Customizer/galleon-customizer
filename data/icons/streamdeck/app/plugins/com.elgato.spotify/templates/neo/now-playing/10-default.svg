<svg xmlns="http://www.w3.org/2000/svg" name="Default" width="232" height="50" viewBox="0 0 232 50" fill="#FFF" font-size="14" font-weight="400">
    <!-- A 232x50 bar. An element says what it shows with an `id`, which may be
         a dotted path — `track.album` reaches into whatever the plugin holds.
         A name nothing answers to is left as it stands, so what is written here
         is what a drawing program shows.

         On a <text>:
           clip-width      room from its own x; past that the value fades out
           max-chars       cut to that many characters, ending with an ellipsis
           font-size-alt   the size used once a value runs long

         On an empty <g>, the plugin draws into it at the size asked for:
           size / width / height / r

         Every group directly inside the animation group is a slide, in the
         order written. On that group:
           direction         up, down, left, right
           duration          seconds a transition takes; nought holds it still
           pause             seconds a slide rests before the next comes
           fps               frames per second while moving
           animation-height  how far a slide travels; the whole bar by default
           animation-width   the same, going sideways
           clip              "x y w h", the box a slide must stay inside

         What is written here is the starting point; a setting made in the
         Property Inspector wins over it. -->

    <!-- <rect id="background" width="232" height="50" fill="#000"/> -->
    <defs>
        <mask id="coverMask" maskUnits="userSpaceOnUse" x="0" y="0" width="42" height="42">
            <rect x="0" y="0" width="42" height="42" rx="6" ry="6" fill="#fff"/>
        </mask>
    </defs>

    <g id="cover" size="42" transform="translate(4 4)" mask="url(#coverMask)"></g>

    <text id="position" x="54" y="34">0:00</text>
    <text id="duration" x="222" y="34" text-anchor="end">0:00</text>

    <g id="shuffleIcon" size="20" transform="translate(94 23)"></g>
    <g id="playIcon" size="20" transform="translate(124 23)"></g>
    <g id="repeatIcon" size="20" transform="translate(154 23)"></g>
    <g id="progress" width="168" height="4" transform="translate(54 41)"></g>

    <g id="animation" direction="up" animation-height="18" clip="54 2 178 20" pause="10" duration="0.8">
        <g><!-- slide -->
            <text id="title" x="54" y="17" font-weight="600" clip-width="164"></text>
        </g>
        <g><!-- slide -->
            <text id="track.artist" x="54" y="17" font-weight="600" clip-width="164"></text>
        </g>
    </g>
</svg>
