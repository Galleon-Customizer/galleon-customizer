<svg xmlns="http://www.w3.org/2000/svg" name="Current + Condition" width="232" height="50" viewBox="0 0 232 50" fill="#FFF">
    <!-- To reach into the data, use "id", "data-infobar" or the shorter "data-info". All three work the same.
        You can use dot-notation to use nested values: "current.humidity" or "hourly.0.time" -->
     <g id="icon"></g>
