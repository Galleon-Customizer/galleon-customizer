<svg xmlns="http://www.w3.org/2000/svg" name="Air Quality + Pollutants + City" width="232" height="50" viewBox="0 0 232 50" font-size="13" fill="#FFF" font-weight="700">
    <rect id="aqi-background"/>
    <text id="aqi-heading" x="56" y="15" font-size="11" opacity=".7"></text>
    <text id="aqi-value" x="8" y="30" font-size="30"></text>
    <text id="aqi-subtitle" x="56" y="30" font-size="11" opacity=".7"></text>

    <path d="M132 8v34" stroke="#FFF" stroke-width="1" opacity=".25" stroke-linecap="round"/>
    <g id="animation" pause="10">
        <g>
            <text id="aqi-pollutant1-label" x="148" y="20" opacity=".7">NO₂</text>
            <text id="aqi-pollutant1-value" x="218" y="20" text-anchor="end">110</text>
            <text id="aqi-pollutant2-label" x="148" y="38" opacity=".7">PM10</text>
            <text id="aqi-pollutant2-value" x="218" y="38" text-anchor="end">57</text>
        </g>
        <g>
            <text id="aqi-pollutant3-label" x="148" y="20" opacity=".7">O₃</text>
            <text id="aqi-pollutant3-value" x="218" y="20" text-anchor="end">9</text>
            <text id="aqi-pollutant4-label" x="148" y="38" opacity=".7">SO₂</text>
            <text id="aqi-pollutant4-value" x="218" y="38" text-anchor="end">6</text>
        </g>
    </g>
    <text id="city" x="4" y="46" font-size="12" font-weight="500"></text>
</svg>
